name: macOS build and release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Package disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --no-install electron-builder --mac dmg --${{ matrix.arch }} --publish never
          mkdir -p artifacts
          version=$(node -p 'require("./package.json").version')
          mv release/*.dmg "artifacts/PixAI-Desktop-${version}-${{ matrix.arch }}.dmg"
          hdiutil verify artifacts/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: artifacts/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: artifacts
        run: |
          sha256sum *.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "PixAI Desktop $GITHUB_REF_NAME" \
            --notes "macOS 安装包：Apple Silicon 请选择 arm64，Intel 请选择 x64。当前版本未使用 Apple Developer ID 签名或公证。" \
            *.dmg SHA256SUMS.txt
